<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Carnet Oficial - La Granjah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        @page {
          size: 400px 250px;
          margin: 0;
        }
        body, html {
          background: white !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 400px !important;
          height: 250px !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body * {
          visibility: hidden;
        }
        .no-print {
          display: none !important;
        }
        #tarjeta-carnet, #tarjeta-carnet * {
          visibility: visible;
        }
        #tarjeta-carnet {
          position: absolute;
          left: 0;
          top: 0;
          margin: 0 !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body
    class="bg-neutral-950 flex flex-col items-center justify-center min-h-screen gap-6 p-4"
  >
    <!-- Botones de control (No salen al imprimir) -->
    <div class="no-print flex gap-4">
      <button
        onclick="cambiarTema('oscuro')"
        class="px-4 py-2 bg-neutral-800 text-slate-200 text-xs font-bold rounded-lg border border-neutral-700 hover:bg-neutral-700 transition cursor-pointer"
      >
        Modo Digital (Oscuro)
      </button>
      <button
        onclick="cambiarTema('blanco')"
        class="px-4 py-2 bg-slate-200 text-neutral-900 text-xs font-bold rounded-lg border border-slate-300 hover:bg-white transition cursor-pointer"
      >
        Modo Impresión (Blanco)
      </button>
      <button
        onclick="window.print()"
        class="px-4 py-2 bg-emerald-500 text-neutral-950 text-xs font-black rounded-lg hover:bg-emerald-400 transition cursor-pointer shadow-lg"
      >
        Imprimir / Guardar PDF
      </button>
    </div>

    <!-- Tarjeta de Carnet Unificada (Estilos en línea puros con Hex para evitar errores de oklch en html2canvas) -->
    <div
      id="tarjeta-carnet"
      style="
        width: 400px;
        height: 250px;
        background-color: #0f172a;
        border-radius: 1rem;
        overflow: hidden;
        border: 1px solid #1e293b;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.25rem;
      "
    >
      <!-- Escudo de fondo con transparencia (Marca de agua lado derecho) -->
      <div
        style="
          position: absolute;
          right: -20px;
          bottom: -20px;
          width: 12rem;
          height: 12rem;
          pointer-events: none;
          z-index: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <img
          src="../../public/escudo/escudoLagranjah.png"
          alt="Marca de agua"
          id="escudo-fondo"
          style="
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.1;
            filter: grayscale(100%);
          "
        />
      </div>

      <!-- Franja Tricolor Superior -->
      <div
        style="
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 10px;
          display: flex;
          z-index: 10;
        "
      >
        <div style="width: 33.333%; background-color: #10b981"></div>
        <div style="width: 33.333%; background-color: #fbbf24"></div>
        <div style="width: 33.333%; background-color: #f43f5e"></div>
      </div>

      <!-- Encabezado / Logo con Escudo -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 0.5rem;
          z-index: 10;
        "
      >
        <div style="display: flex; align-items: center; gap: 0.5rem">
          <img
            src="../../public/escudo/escudoLagranjah.png"
            alt="Escudo La Granjah"
            style="width: 2rem; height: 2rem; object-fit: contain"
          />
          <span
            id="texto-titulo"
            style="
              color: #ffffff;
              font-weight: 900;
              letter-spacing: 0.05em;
              text-transform: uppercase;
              font-size: 1.125rem;
            "
            >La Granjah</span
          >
        </div>
        <span
          id="badge-socio"
          style="
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #34d399;
            background-color: #022c22;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            border: 1px solid #065f46;
          "
          >Socio Activo</span
        >
      </div>

      <!-- Cuerpo: Foto y Datos -->
      <div
        style="
          display: flex;
          align-items: center;
          gap: 1rem;
          margin: auto 0;
          z-index: 10;
        "
      >
        <!-- Foto Carnet -->
        <div
          id="contenedor-foto"
          style="
            width: 5rem;
            height: 6rem;
            background-color: rgba(30, 41, 59, 0.9);
            border-radius: 0.5rem;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 500;
            text-align: center;
            overflow: hidden;
          "
        >
          <img 
            src="fotosCarnet/diegoLunaGranjhistico.jpg" 
            alt="Foto Carnet" 
            style="width: 100%; height: 100%; object-fit: cover;"
          >
        </div>
        <!-- Datos del Socio -->
        <div style="display: flex; flex-direction: column; gap: 0.25rem">
          <div>
            <p
              id="label-nombre"
              style="
                font-size: 10px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                margin: 0;
              "
            >
              Apellido y Nombre
            </p>
            <p
              id="txt-nombre"
              style="
                color: #ffffff;
                font-weight: bold;
                font-size: 1rem;
                line-height: 1.25;
                margin: 0;
              "
            >
              Diego Luna
            </p>
          </div>
          <div>
            <p
              style="
                font-size: 10px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                margin: 0;
              "
            >
              DNI
            </p>
            <p
              id="txt-dni"
              style="color: #e2e8f0; font-size: 0.875rem; margin: 0"
            >
              37.743.088
            </p>
          </div>
<!--           <div>
            <p
              style="
                font-size: 10px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                margin: 0;
              "
            >
              F. Nacimiento
            </p>
            <p
              id="txt-fecha"
              style="color: #e2e8f0; font-size: 0.875rem; margin: 0"
            >
              07/08/1993
            </p>
          </div> -->
          <div>
            <p
              style="
                font-size: 10px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                margin: 0;
              "
            >
              N° de Socio
            </p>
            <p
              id="txt-socio"
              style="
                color: #fbbf24;
                font-family: monospace;
                font-weight: bold;
                font-size: 0.875rem;
                margin: 0;
              "
            >
              #24
            </p>
          </div>
                    <div>
            <p
              style="
                font-size: 10px;
                color: #94a3b8;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
                margin: 0;
              "
            >
              Tipo de Socio
            </p>
            <p
              id="txt-socio"
              style="
                color: #fbbf24;
                font-family: monospace;
                font-weight: bold;
                font-size: 0.875rem;
                margin: 0;
              "
            >
              Socio Granjhístico
            </p>
          </div>
        </div>
      </div>

      <!-- Elemento decorativo inferior -->
      <div style="height: 0.25rem; z-index: 10"></div>
    </div>

    <!-- Script para leer los datos de la URL y alternar estilos -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);

        const nombre = params.get("nombre");
        const dni = params.get("dni");
        const fecha = params.get("fecha");
        const socio = params.get("socio");
        const fotoUrl = params.get("foto");

        if (nombre)
          document.getElementById("txt-nombre").textContent =
            decodeURIComponent(nombre);
        if (dni) document.getElementById("txt-dni").textContent = dni;
        if (fecha) document.getElementById("txt-fecha").textContent = fecha;
        if (socio)
          document.getElementById("txt-socio").textContent = `#${socio}`;

        if (fotoUrl) {
          const contenedorFoto = document.getElementById("contenedor-foto");
          contenedorFoto.innerHTML = `<img src="${decodeURIComponent(fotoUrl)}" alt="Foto Socio" style="width: 100%; height: 100%; object-fit: cover;">`;
        }
      });

      // Función para alternar temas de visualización e impresión de forma segura
      function cambiarTema(tipo) {
        const tarjeta = document.getElementById("tarjeta-carnet");
        const textoTitulo = document.getElementById("texto-titulo");
        const badgeSocio = document.getElementById("badge-socio");
        const contenedorFoto = document.getElementById("contenedor-foto");
        const labelNombre = document.getElementById("label-nombre");
        const txtNombre = document.getElementById("txt-nombre");
        const txtDni = document.getElementById("txt-dni");
        const txtFecha = document.getElementById("txt-fecha");
        const escudoFondo = document.getElementById("escudo-fondo");

        if (tipo === "blanco") {
          tarjeta.style.backgroundColor = "#ffffff";
          tarjeta.style.borderColor = "#cbd5e1";
          textoTitulo.style.color = "#0f172a";
          badgeSocio.style.color = "#047857";
          badgeSocio.style.backgroundColor = "#ecfdf5";
          badgeSocio.style.borderColor = "#a7f3d0";
          contenedorFoto.style.backgroundColor = "#f1f5f9";
          contenedorFoto.style.borderColor = "#cbd5e1";
          contenedorFoto.style.color = "#94a3b8";
          labelNombre.style.color = "#64748b";
          txtNombre.style.color = "#0f172a";
          txtDni.style.color = "#334155";
          if (txtFecha) txtFecha.style.color = "#334155";
          escudoFondo.style.opacity = "0.7";
        } else {
          tarjeta.style.backgroundColor = "#0f172a";
          tarjeta.style.borderColor = "#1e293b";
          textoTitulo.style.color = "#ffffff";
          badgeSocio.style.color = "#34d399";
          badgeSocio.style.backgroundColor = "#022c22";
          badgeSocio.style.borderColor = "#065f46";
          contenedorFoto.style.backgroundColor = "rgba(30, 41, 59, 0.9)";
          contenedorFoto.style.borderColor = "#334155";
          contenedorFoto.style.color = "#64748b";
          labelNombre.style.color = "#94a3b8";
          txtNombre.style.color = "#ffffff";
          txtDni.style.color = "#e2e8f0";
          if (txtFecha) txtFecha.style.color = "#e2e8f0";
          escudoFondo.style.opacity = "0.1";
        }
      }
    </script>
  </body>
</html>
