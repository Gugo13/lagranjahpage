<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Carnet Oficial - La Granjah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        body {
          background: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body
    class="bg-neutral-950 flex flex-col items-center justify-center min-h-screen gap-6 p-4"
  >
    <!-- Botones de control (No salen al imprimir) -->
    <div class="no-print flex gap-4">
      <button
        onclick="cambiarTema('oscuro')"
        class="px-4 py-2 bg-neutral-800 text-slate-200 text-xs font-bold rounded-lg border border-neutral-700 hover:bg-neutral-700 transition cursor-pointer"
      >
        Modo Digital (Oscuro)
      </button>
      <button
        onclick="cambiarTema('blanco')"
        class="px-4 py-2 bg-slate-200 text-neutral-900 text-xs font-bold rounded-lg border border-slate-300 hover:bg-white transition cursor-pointer"
      >
        Modo Impresión (Blanco)
      </button>
      <button
        onclick="window.print()"
        class="px-4 py-2 bg-emerald-500 text-neutral-950 text-xs font-black rounded-lg hover:bg-emerald-400 transition cursor-pointer shadow-lg"
      >
        Imprimir / Guardar PDF
      </button>
    </div>

    <!-- Tarjeta de Carnet Unificada (Sin pie) -->
    <div
      id="tarjeta-carnet"
      class="w-[400px] h-[250px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-800 relative flex flex-col justify-between p-5 transition-all duration-300"
    >
      <!-- Escudo de fondo con transparencia (Marca de agua lado derecho) -->
      <div
        class="absolute right-[-20px] bottom-[-20px] w-48 h-48 pointer-events-none z-0 flex items-center justify-center"
      >
        <img
          src="../../public/escudo/escudoLagranjah.png"
          alt="Marca de agua"
          id="escudo-fondo"
          class="w-full h-full object-contain opacity-10 filter grayscale"
        />
      </div>

      <!-- Franja Tricolor Superior -->
      <div class="absolute top-0 left-0 right-0 h-2.5 flex z-10">
        <div class="w-1/3 bg-emerald-500"></div>
        <div class="w-1/3 bg-amber-400"></div>
        <div class="w-1/3 bg-rose-500"></div>
      </div>

      <!-- Encabezado / Logo con Escudo -->
      <div class="flex justify-between items-center mt-2 z-10">
        <div class="flex items-center space-x-2">
          <img
            src="../../public/escudo/escudoLagranjah.png"
            alt="Escudo La Granjah"
            class="w-8 h-8 object-contain"
          />
          <span
            id="texto-titulo"
            class="text-white font-black tracking-wider uppercase text-lg"
            >La Granjah</span
          >
        </div>
        <span
          id="badge-socio"
          class="text-xs font-semibold uppercase tracking-widest text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded-full border border-emerald-800"
          >Socio Activo</span
        >
      </div>

      <!-- Cuerpo: Foto y Datos (Ocupa el espacio central cómodamente) -->
      <div class="flex items-center space-x-4 my-auto z-10">
        <!-- Foto Carnet -->
        <div
          id="contenedor-foto"
          class="w-20 h-24 bg-slate-800/90 rounded-lg border-2 border-slate-700 flex items-center justify-center text-slate-500 text-xs font-medium text-center overflow-hidden backdrop-blur-xs"
        >
          FOTO
        </div>
        <!-- Datos del Socio -->
        <div class="flex flex-col space-y-1">
          <div>
            <p
              id="label-nombre"
              class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold"
            >
              Apellido y Nombre
            </p>
            <p
              id="txt-nombre"
              class="text-white font-bold text-base leading-tight"
            >
              Cargando...
            </p>
          </div>
          <div>
            <p
              class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold"
            >
              DNI
            </p>
            <p id="txt-dni" class="text-slate-200 text-sm">-</p>
          </div>
          <div>
            <p
              class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold"
            >
              N° de Socio
            </p>
            <p
              id="txt-socio"
              class="text-amber-400 font-mono font-bold text-sm"
            >
              #----
            </p>
          </div>
        </div>
      </div>

      <!-- Elemento decorativo inferior sutil para cerrar la tarjeta sin texto -->
      <div class="h-1 z-10"></div>
    </div>

    <!-- Script para leer los datos de la URL y alternar estilos -->
    <script>
      // 1. Inyectar datos automáticamente desde los parámetros de la URL al cargar
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);

        const nombre = params.get("nombre");
        const dni = params.get("dni");
        const socio = params.get("socio");
        const fotoUrl = params.get("foto");

        if (nombre)
          document.getElementById("txt-nombre").textContent =
            decodeURIComponent(nombre);
        if (dni) document.getElementById("txt-dni").textContent = dni;
        if (socio)
          document.getElementById("txt-socio").textContent = `#${socio}`;

        if (fotoUrl) {
          const contenedorFoto = document.getElementById("contenedor-foto");
          contenedorFoto.innerHTML = `<img src="${decodeURIComponent(fotoUrl)}" alt="Foto Socio" class="w-full h-full object-cover">`;
        }
      });

      // 2. Función para alternar temas (Oscuro / Blanco Impresión)
      function cambiarTema(tipo) {
        const tarjeta = document.getElementById("tarjeta-carnet");
        const textoTitulo = document.getElementById("texto-titulo");
        const badgeSocio = document.getElementById("badge-socio");
        const contenedorFoto = document.getElementById("contenedor-foto");
        const labelNombre = document.getElementById("label-nombre");
        const txtNombre = document.getElementById("txt-nombre");
        const txtDni = document.getElementById("txt-dni");
        const escudoFondo = document.getElementById("escudo-fondo");

        if (tipo === "blanco") {
          tarjeta.className =
            "w-[400px] h-[250px] bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-300 relative flex flex-col justify-between p-5 transition-all duration-300";
          textoTitulo.className =
            "text-slate-900 font-black tracking-wider uppercase text-lg";
          badgeSocio.className =
            "text-xs font-semibold uppercase tracking-widest text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200";
          contenedorFoto.className =
            "w-20 h-24 bg-slate-100/90 rounded-lg border-2 border-slate-300 flex items-center justify-center text-slate-400 text-xs font-medium text-center overflow-hidden";
          labelNombre.className =
            "text-[10px] text-slate-500 uppercase tracking-wider font-semibold";
          txtNombre.className =
            "text-slate-900 font-bold text-base leading-tight";
          txtDni.className = "text-slate-700 text-sm";

          // MODO BLANCO: Escudo A COLOR (sin escala de grises) y con 20% de opacidad para que se luzca el tricolor
          escudoFondo.className = "w-full h-full object-contain opacity-70";
        } else {
          tarjeta.className =
            "w-[400px] h-[250px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-800 relative flex flex-col justify-between p-5 transition-all duration-300";
          textoTitulo.className =
            "text-white font-black tracking-wider uppercase text-lg";
          badgeSocio.className =
            "text-xs font-semibold uppercase tracking-widest text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded-full border border-emerald-800";
          contenedorFoto.className =
            "w-20 h-24 bg-slate-800/90 rounded-lg border-2 border-slate-700 flex items-center justify-center text-slate-500 text-xs font-medium text-center overflow-hidden";
          labelNombre.className =
            "text-[10px] text-slate-400 uppercase tracking-wider font-semibold";
          txtNombre.className = "text-white font-bold text-base leading-tight";
          txtDni.className = "text-slate-200 text-sm";

          // MODO OSCURO: Escudo con escala de grises y opacidad sutil (10%)
          escudoFondo.className =
            "w-full h-full object-contain opacity-10 filter grayscale";
        }
      }
    </script>
  </body>
</html>
